name: Build Linux AppImage

on:
  workflow_dispatch:          # lets you press "Run workflow" on GitHub
  push:
    tags: ['v*']              # or push a tag like v1.0 to also publish it as a Release

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04     # older base = the AppImage runs on more Linux distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y curl
      - run: bash build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader_AppImage
          path: dist/MusicDownloader_AppImage/MusicDownloader.AppImage
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MusicDownloader_AppImage/MusicDownloader.AppImage
